[package]
name = "squoosh-gif"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--no-validation"]

[lib]
crate-type = ["cdylib"]

[dependencies]
gif = "0.13.1"
rgb = "0.8.50"
wasm-bindgen = "=0.2.74"
wasm-bindgen-test = "=0.3.24"
web-sys = { version = "=0.3.45", features = ["ImageData"] }

[profile.release]
lto = true
opt-level = "s"
